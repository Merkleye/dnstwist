# Loaded on top of mise.toml when MISE_ENV=release, which the release
# workflow sets. semantic-release.yml's `sbom: true` runs syft off this pin
# once the image is pushed -- it invokes syft but never installs it, so this
# file is what decides the version. Nothing else in this repo uses it, so a
# PR run never installs it.
[tools]
syft = "1"
