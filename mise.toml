[tools]
# The published image pins its own python:3.12-slim base in the Containerfile
# independently of this; this is what CI and a local `mise run test` use.
python = "3.12"
node = "22" # .github/workflows/release.yml

[tasks.test]
description = "Install test dependencies and run the pytest suite with a 100% statement-coverage floor"
run = """
set -e
pip install -q -r requirements.txt -r requirements-dev.txt
pytest --cov=app --cov-report=term-missing --cov-fail-under=100
"""
