[tools]
# The published image pins its own python:3.12-slim base in the Containerfile
# independently of this; this is what CI and a local `mise run test` use.
python = "3.14.7"
node = "24" # .github/workflows/release.yml

[tasks.test]
description = "Install test dependencies and run the pytest suite with a 100% statement-coverage floor"
run = """
set -e
pip install -q -r requirements.txt -r requirements-dev.txt
# python -m pytest, not a bare `pytest`: tests/ has no __init__.py, so
# pytest's own rootdir-insertion puts tests/ on sys.path, not the repo
# root -- `import app` then fails. `python -m` adds the cwd (repo root)
# to sys.path itself, which is what makes the import resolve.
python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=100
"""
