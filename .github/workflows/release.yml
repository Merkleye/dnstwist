name: Release

# Manual: a release is a deliberate act, not a side effect of every merge.
on:
  workflow_dispatch:

concurrency:
  # An in-flight release must never be cancelled mid-push; later triggers
  # queue behind it instead of racing it.
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # tag, CHANGELOG commit, GitHub Release
      packages: write # image push
    uses: Merkleye/github-templates/.github/workflows/semantic-release.yml@2df9abc1c2797c87571b993498850eced6fdf21b # main
    with:
      # @semantic-release/git pushes CHANGELOG.md to a protected main, which
      # the default GITHUB_TOKEN cannot do.
      app-token: true
      containers: true
      # The same JSON pr-preview-image.yml passes, so a preview builds exactly
      # what a release builds. The template pushes v<version>, v<major> and
      # latest.
      images: '[{"image":"dnstwist","context":".","file":"Containerfile"}]'
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
