name: Release

# Manual only — a release is a deliberate act, not a side effect of every
# merge to main. The job-level `if` below guards against a dispatch fired
# against the wrong ref.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  # Unlike ci.yml's PR concurrency group, an in-flight release must never be
  # cancelled mid-push — later triggers queue behind it instead of racing it.
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Mints a short-lived token from the same release-bot GitHub App used by
      # merkleye/merkleye (org-level secrets APP_ID/APP_PRIVATE_KEY) so
      # @semantic-release/git can push CHANGELOG.md to main even with branch
      # protection enabled — the default GITHUB_TOKEN cannot bypass that.
      - name: Mint release-bot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release needs full history to analyze commits since the
          # last tag.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure release-bot git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      # Utilize mise for CI and local — node is pinned in mise.toml, so
      # `mise install` mirrors this job exactly.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installs the syft CLI only (not the full scanning action) — SBOM
      # generation happens from inside scripts/release-image.sh, per
      # platform, once the image is actually built and pushed.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install release tooling
        run: npm ci

      # Single semantic-release run does everything: computes the version,
      # builds/pushes the image + generates its SBOM (via
      # @semantic-release/exec's prepareCmd -> scripts/release-image.sh),
      # updates CHANGELOG.md and commits it (release-bot identity above),
      # then creates the GitHub Release with the SBOM files attached.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
