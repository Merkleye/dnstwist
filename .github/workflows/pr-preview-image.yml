# Publishes a throwaway container image per pull request so a reviewer can
# run the change instead of reading a Containerfile diff, and deletes it
# again when the PR closes.
name: PR preview image lifecycle

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions: {}

jobs:
  publish-preview:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-image.yml@main
    with:
      images: '[{"image":"dnstwist","context":".","file":"Containerfile"}]'

  cleanup-preview:
    if: github.event.action == 'closed'
    permissions:
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-cleanup.yml@main
    with:
      packages: '["dnstwist"]'
