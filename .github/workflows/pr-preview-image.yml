# Publishes a throwaway container image per pull request so a reviewer can
# run the change instead of reading a Containerfile diff, and deletes it
# again when the PR closes.
#
# Both halves come from Merkleye/github-templates. This file was a third
# copy of the same 194-line workflow that merkleye/merkleye and certspotter
# each carried, differing only in the image name.
#
# The template's defaults already match this repo -- ubuntu-latest, the
# docker builder, ghcr.io, and the pr- tag prefix -- so nothing is
# overridden. What stays here is the one repo-specific fact: this tree ships
# a single image, built from ./Containerfile.
name: PR preview image lifecycle

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions: {}

jobs:
  publish-preview:
    if: github.event.action != 'closed'
    # Matches the permissions the called job requests. A called workflow can
    # narrow the token but never widen it, so these have to be granted here.
    permissions:
      contents: read
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-image.yml@main
    with:
      images: '[{"image":"merkleye-dnstwist","context":".","file":"Containerfile"}]'

  cleanup-preview:
    if: github.event.action == 'closed'
    permissions:
      packages: write
    uses: Merkleye/github-templates/.github/workflows/ghcr-pr-preview-cleanup.yml@main
    with:
      packages: '["merkleye-dnstwist"]'
