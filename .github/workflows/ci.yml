name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests, mise-driven: mise.toml's `test` task installs
  # requirements.txt + requirements-dev.txt and runs pytest with a 100%
  # statement-coverage floor (--cov-fail-under=100) — see tests/test_app.py.
  # Every network call is mocked, so this never depends on real DNS.
  test:
    name: Test (100% coverage floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Run tests
        run: mise run test

  # Same "container integrity" gate as merkleye/merkleye's container-build
  # job — actually builds the Containerfile referenced from
  # merkleye/merkleye's deploy/docker-compose.yml, rather than trusting that
  # it merely parses.
  container-build:
    name: Build dnstwist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dnstwist
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          tags: dnstwist:ci
          cache-from: type=gha,scope=dnstwist
          cache-to: type=gha,mode=max,scope=dnstwist
